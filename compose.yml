services:
  movie:
    image: neo4flix/movie:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: movie
        APP_PORT: 8081
    env_file:
      - .env

  user:
    image: neo4flix/user:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user
        APP_PORT: 8082
    env_file:
      - .env
    environment:
      RATING_SERVICE_URL: http://rating:8083

  rating:
    image: neo4flix/rating:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: rating
        APP_PORT: 8083
    env_file:
      - .env
  recommendation:
    image: neo4flix/recommendation:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: recommendation
        APP_PORT: 8084
    env_file:
      - .env
  caddy:
    image: caddy:2
    container_name: neo4flix-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - movie
      - user
      - rating
      - recommendation
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
