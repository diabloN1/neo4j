server:
  port: 8084

spring:
  application:
    name: RECOMMENDATION-SERVICE
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.data.neo4j: DEBUG
    org.neo4j.driver: DEBUG