<main
  class="min-h-[calc(100vh-4rem)] bg-zinc-950 px-4 py-10 text-zinc-100 sm:px-6 lg:px-8"
>
  <div class="mx-auto max-w-5xl">
    <header class="mb-8">
      <p
        class="mb-2 text-xs font-bold uppercase tracking-[0.24em] text-rose-400"
      >
        Your account
      </p>
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">
        Account settings
      </h1>
      <p class="mt-2 max-w-2xl text-sm leading-6 text-zinc-400">
        Manage your personal information, security and account preferences.
      </p>
    </header>

    @if (loadingProfile()) {
      <section class="rounded-2xl border border-white/10 bg-zinc-900/70 p-8">
        <div class="flex items-center gap-3 text-sm text-zinc-400">
          <span
            class="size-5 animate-spin rounded-full border-2 border-zinc-600 border-t-rose-500"
          ></span>
          Loading your account…
        </div>
      </section>
    } @else if (loadError()) {
      <section
        class="rounded-2xl border border-red-500/20 bg-red-500/5 p-6"
        role="alert"
      >
        <h2 class="font-semibold text-red-300">Couldn't load your account</h2>
        <p class="mt-1 text-sm text-zinc-400">{{ loadError() }}</p>
        <button
          type="button"
          (click)="loadProfile()"
          class="mt-4 rounded-lg bg-zinc-100 px-4 py-2 text-sm font-semibold text-zinc-950 transition hover:bg-white"
        >
          Try again
        </button>
      </section>
    } @else {
      <div class="grid gap-6 lg:grid-cols-[240px_minmax(0,1fr)]">
        <app-profile-sidebar [profile]="profile()!" />

        <div class="flex flex-col gap-6">
          <app-personal-information
            [profile]="profile()!"
            (profileUpdated)="profile.set($event)"
          />

          <app-user-ratings [ratings]="profile()?.ratings ?? []" />

          <app-password-security />

          <app-two-factor-authentication />

          <app-danger-zone />
        </div>
      </div>
    }
  </div>
</main>
