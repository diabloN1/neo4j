<aside class="h-fit rounded-2xl border border-white/10 bg-zinc-900/70 p-5">
  <div class="flex items-center gap-3 lg:flex-col lg:items-start">
    <div
      class="grid size-14 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-rose-500 to-rose-800 text-xl font-bold text-white shadow-lg shadow-rose-950/40"
    >
      {{ initials() }}
    </div>

    <div class="min-w-0">
      <p class="truncate font-semibold text-white">
        {{ profile().name }}
      </p>
      <p class="truncate text-xs text-zinc-500">
        {{ profile().email }}
      </p>
    </div>
  </div>

  <div class="mt-5 border-t border-white/10 pt-4">
    <p
      class="text-[11px] font-semibold uppercase tracking-[0.18em] text-zinc-500"
    >
      Member since
    </p>
    <p class="mt-1 text-sm text-zinc-300">
      {{ profile().createdAt | date: "MMMM yyyy" }}
    </p>
  </div>

  <div class="mt-5 rounded-xl bg-white/[0.03] p-3">
    <p class="text-xs leading-5 text-zinc-400">
      Keep your account details up to date so your Neo4flix experience stays
      yours.
    </p>
  </div>
</aside>
