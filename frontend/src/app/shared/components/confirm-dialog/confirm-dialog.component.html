@if (dialogService.isOpen()) {
  <!-- Overlay Wrapper -->
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
    <!-- Backdrop: Solid 80% black with blur -->
    <div
      (click)="dialogService.handleCancel()"
      class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity"
    ></div>

    <!-- Dialog Box -->
    <div
      class="relative z-[101] w-full max-w-md rounded-xl border border-zinc-800 bg-[#16161a] p-6 text-zinc-100 shadow-2xl shadow-black sm:rounded-2xl"
    >
      <div class="flex flex-col space-y-2 text-left">
        <h2 class="text-lg font-bold tracking-tight text-white">
          {{ dialogService.options().title }}
        </h2>
        <p class="text-sm text-zinc-400 leading-relaxed">
          {{ dialogService.options().description }}
        </p>
      </div>

      <div
        class="mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-2 border-t border-zinc-800/80 pt-4"
      >
        <button
          type="button"
          (click)="dialogService.handleCancel()"
          class="inline-flex h-9 items-center justify-center rounded-lg border border-zinc-700 bg-zinc-800/50 px-4 text-xs font-semibold text-zinc-300 hover:bg-zinc-800 hover:text-white transition"
        >
          {{ dialogService.options().cancelText }}
        </button>
        <button
          type="button"
          (click)="dialogService.handleConfirm()"
          [class]="
            dialogService.options().variant === 'destructive'
              ? 'inline-flex h-9 items-center justify-center rounded-lg bg-rose-600 hover:bg-rose-500 px-4 text-xs font-semibold text-white shadow-lg shadow-rose-950/50 transition'
              : 'inline-flex h-9 items-center justify-center rounded-lg bg-zinc-100 hover:bg-white text-zinc-950 px-4 text-xs font-semibold transition'
          "
        >
          {{ dialogService.options().confirmText }}
        </button>
      </div>
    </div>
  </div>
}
